# Ships the iPhone app's screens through Capgo whenever main changes, the way Vercel ships the
# website: it runs `npm run update:app` once the Checks workflow passes on a push to main. Phones
# download the update in the background and switch to it the next time the app opens.
#
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   secret   CAPGO_TOKEN                    your Capgo API key
#   variable NEXT_PUBLIC_REVENUECAT_IOS_KEY the public RevenueCat iOS key (appl_...), once RevenueCat
#            is set up; until then updates ship with in-app purchases off
#
# A change that needs a new Xcode build (a new plugin, permission or icon) makes this fail rather
# than upload: ship the new build through the App Store (or install it from Xcode / TestFlight)
# first, then re-run it from the Actions tab ("Run workflow") with "I've installed a new Xcode/
# TestFlight build" ticked, which uploads once despite the plugin change.
name: App update

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      native_build_installed:
        description: "I've installed a new Xcode/TestFlight build with the latest plugins (upload even though plugins changed)"
        type: boolean
        default: false

concurrency:
  group: app-update
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: '1'
      CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
      NEXT_PUBLIC_REVENUECAT_IOS_KEY: ${{ vars.NEXT_PUBLIC_REVENUECAT_IOS_KEY }}
      # Ticked on a manual run after a new native build is out: skip the native-plugin check once.
      ALLOW_NATIVE_CHANGE: ${{ github.event_name == 'workflow_dispatch' && inputs.native_build_installed && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check settings
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then echo "::error::Add the CAPGO_TOKEN secret (your Capgo API key) in the repo's Actions settings."; exit 1; fi
          if [ -z "$NEXT_PUBLIC_REVENUECAT_IOS_KEY" ]; then echo "::warning::No NEXT_PUBLIC_REVENUECAT_IOS_KEY variable yet, so in-app purchases stay off in this update. Add it once RevenueCat is set up."; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and upload to Capgo
        run: npm run update:app -- --comment "main ${GITHUB_SHA_SHORT}"
        env:
          GITHUB_SHA_SHORT: ${{ github.event.workflow_run.head_sha || github.sha }}
